# This rule is not used by the project mon-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over apps.thomas-herve.fr.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mon-operator
    app.kubernetes.io/managed-by: kustomize
  name: gameinstancesmanager-admin-role
rules:
- apiGroups:
  - apps.thomas-herve.fr
  resources:
  - gameinstancesmanagers
  verbs:
  - '*'
- apiGroups:
  - apps.thomas-herve.fr
  resources:
  - gameinstancesmanagers/status
  verbs:
  - get
