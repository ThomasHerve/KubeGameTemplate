<!DOCTYPE html>

<html lang="fr"> <head> <meta charset="UTF-8"> <title>Kubernetes Chat Rooms</title>

<style> body { font-family: Arial, sans-serif; background: #111827; color: white; margin: 0; padding: 20px; } .container { max-width: 800px; margin: auto; } .card { background: #1f2937; padding: 20px; border-radius: 10px; margin-top: 20px; } input, button { padding: 10px; margin-top: 10px; border-radius: 5px; border: none; } input { width: calc(100% - 20px); } button { cursor: pointer; background: #2563eb; color: white; } button:hover { background: #1d4ed8; } .hidden { display: none; } #messages { height: 300px; overflow-y: auto; background: black; padding: 10px; border-radius: 5px; } .message { margin-bottom: 5px; } .host { color: #22c55e; } .info { color: #93c5fd; } #error { color: red; } </style>

</head>

<body>

<div class="container">

<h1>🎮 Kubernetes Chat Rooms</h1>

<!-- LOBBY -->

<div id="lobby" class="card">

<h2>Quel pseudo voulez-vous utiliser ?</h2>

<input id="nickname" placeholder="Pseudo" />

<h2>Créer une room</h2>

<button onclick="createRoom()"> Créer </button>

<h2>Rejoindre une room</h2>

<input id="roomId" placeholder="ID de la room" />

<button onclick="joinRoom()"> Rejoindre </button>

<p id="createResult"></p>

</div>




<!-- ROOM -->

<div id="room" class="card hidden">

<h2> Room : <span id="roomName"></span> </h2>

<div>Pseudo : <strong id="currentNickname"></strong></div>

<div id="messages"></div>

<input id="messageInput" placeholder="Message" />

<button onclick="sendMessage()"> Envoyer </button>

<div> <br>

<input id="hostKey" placeholder="Host key (optionnel)" />

<button onclick="authenticateHost()"> Devenir host </button>

</div>

<button onclick="leaveRoom()"> Quitter </button>

</div>

<div id="error"></div>

</div>



<script src="config.js"></script>
<script>
//
// Configuration
//

const BACKEND_URL = window.APP_CONFIG.BACKEND_PROTOCOL + "://" + window.APP_CONFIG.BACKEND_URL;

let websocket = null;
let currentRoom = null;
let userNickname = "";



//
// Création room
//

async function createRoom() {

    try {

        const response = await fetch(
            BACKEND_URL + "/create-room",
            {
                method: "POST"
            }
        );


        const data = await response.json();


        document.getElementById("createResult").innerHTML =
        `
        Room créée : <b>${data.instance}</b><br>
        `;


        joinRoom(data.instance);

    }
    catch (e) {

        showError(e);

    }

}



//
// Rejoindre une room
//

function joinRoom(id = null) {

    const room =
        id ||
        document.getElementById("roomId").value;
    const nickname =
        document.getElementById("nickname").value.trim();

    if (!nickname) {
        showError("Choisissez un pseudo avant de rejoindre la room.");
        return;
    }

    if (!room) {
        showError("Indiquez l'ID de la room.");
        return;
    }

    userNickname = nickname;
    currentRoom = room;

    document
        .getElementById("lobby")
        .classList
        .add("hidden");

    document
        .getElementById("room")
        .classList
        .remove("hidden");

    document.getElementById("roomName")
        .innerText = room;
    document.getElementById("currentNickname")
        .innerText = userNickname;

    connectWebsocket(room);

}



//
// Connexion WebSocket
//

async function connectWebsocket(room, attempt = 1) {

    const maxAttempts = 5;
    const retryDelay = 5000;


    const protocol =
        window.location.protocol === "https:"
            ? "wss://"
            : "ws://";


    const url =
        protocol +
        window.APP_CONFIG.BACKEND_URL +
        "/" +
        room;


    addMessage(
        `Connexion websocket (${attempt}/${maxAttempts})...`,
        "info"
    );


    websocket = new WebSocket(url);


    websocket.onopen = () => {

        addMessage(
            "Connecté à la room",
            "info"
        );

        if (userNickname) {
            websocket.send(JSON.stringify({
                type: "join",
                nickname: userNickname
            }));
        }

    };


    websocket.onmessage = event => {

        addMessage(
            event.data
        );

    };


    websocket.onerror = () => {

        addMessage(
            "Erreur websocket",
            "info"
        );

    };


    websocket.onclose = async (event) => {

        // Si la connexion n'a jamais réussi
        if (attempt < maxAttempts) {

            addMessage(
                `Serveur non prêt, nouvel essai dans ${retryDelay / 1000}s...`,
                "info"
            );


            await new Promise(
                resolve => setTimeout(resolve, retryDelay)
            );


            connectWebsocket(
                room,
                attempt + 1
            );

        }
        else {

            addMessage(
                "Impossible de joindre la room après plusieurs tentatives",
                "info"
            );

        }

    };

}


//
// Envoi message
//

function sendMessage() {

    const messageInput =
        document.getElementById("messageInput");

    const text = messageInput.value.trim();

    if (!text) {
        return;
    }

    if (
        websocket &&
        websocket.readyState === WebSocket.OPEN
    ) {

        websocket.send(JSON.stringify({
            type: "message",
            text
        }));

        messageInput.value = "";

    }

}



//
// Authentification host
//

function authenticateHost() {

    const key =
        document.getElementById("hostKey").value;


    if (
        websocket &&
        websocket.readyState === WebSocket.OPEN
    ) {

        websocket.send(key);

    }

}



//
// Affichage messages
//

function addMessage(
    msg,
    type = ""
) {

    const div =
        document.createElement("div");


    div.className =
        "message " + type;


    div.innerText =
        msg;


    document
        .getElementById("messages")
        .appendChild(div);

}



//
// Quitter la room
//

function leaveRoom() {

    if (websocket) {

        websocket.close();
        websocket = null;

    }


    document
        .getElementById("room")
        .classList
        .add("hidden");


    document
        .getElementById("lobby")
        .classList
        .remove("hidden");

}



//
// Gestion erreur
//

function showError(e) {

    document
        .getElementById("error")
        .innerText = e;

}
</script>


</body> </html>
