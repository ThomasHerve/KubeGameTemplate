{{ if .Values.legacy}}
{{- if .Values.httpRoute.enabled -}}
{{ $dot := . }}
{{- range .Values.httpRoute.hosts }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-operator-{{ .name }}
spec:
  parentRefs:
    - name: {{ $dot.Values.httpRoute.gatewayName }}
      namespace: {{ $dot.Values.httpRoute.gatewayNamespace }}
  hostnames:
    - {{ .host }}
  rules:
    - matches:
          - path:
              type: PathPrefix
              value: /
      backendRefs:
        - name: {{ .service }}
          kind: Service
          port: {{ .port }}
          weight: 1
{{- end }}
{{- end -}}
{{- end }}