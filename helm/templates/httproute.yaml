{{- if .Values.httpRoute.enabled -}}
{{ $dot := . }}
{{- range .Values.httpRoute.hosts }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-operator
spec:
  {{- if and .Values.httpRoute.gatewayName .Values.httpRoute.gatewayNamespace }}
  parentRefs:
    - name: {{ $dot.Values.httpRoute.gatewayName }}
      namespace: {{ $dot.Values.httpRoute.gatewayNamespace }}
  {{- end }}
  hostnames:
    {{- toYaml .host | nindent 4 }}
  rules:
    {{- range .rules }}
    - matches:
      rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
      backendRefs:
        - name: operator-gateway
          port: 80
          weight: 1
    {{- end }}
{{- end }}
{{- end -}}