{{- if .Values.real_operator }}
apiVersion: apps.thomas-herve.fr/v1alpha1
kind: GameInstancesManager
metadata:
  name: operator-game-manager
  namespace: {{ .Values.namespace }}
spec:
  hostname: {{ .Values.frontend.host }}
  instance:
    repository: thomasherve/kube-game-instance
    pullPolicy: Always
    tag: "latest"
    internalPort: 8000
  frontend:
    enabled: true
    repository: {{ .Values.frontend.repository }}
    tag: {{ .Values.frontend.tag | default .Chart.AppVersion }}
    pullPolicy: Always
    replicas: 1
    port: {{ .Values.frontend.port }}
    externalport: {{ .Values.frontend.port }}
    backendProtocol: https
    httpRouteEnabled: false
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
{{- end }}