{{- if .Values.real_operator }}
apiVersion: apps.example.com/v1alpha1
kind: GameInstanceManager
metadata:
  name: asyncunitytemplate
  namespace: default
spec:
  frontend:
    repository: {{ .Values.frontend.repository }}
    tag: {{ .Values.frontend.tag | default .Chart.AppVersion }}
    pullPolicy: IfNotPresent
    replicas: 1
    port: {{ .Values.frontend.port }}
    backendURL: {{ (index .Values.httpRoute.hosts 0).host }}
    backendProtocol: https
    httpRouteEnabled: false
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
{{- end }}